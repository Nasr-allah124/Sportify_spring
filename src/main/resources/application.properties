
spring.application.name=sportify-backend

server.port=8080

# Connexion PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/sportify_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway temporairement desactive
spring.flyway.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info
sportify.email-verification.secret=${EMAIL_VERIFICATION_SECRET}
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_SMTP_LOGIN}
spring.mail.password=${BREVO_SMTP_KEY}
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.starttls.required]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

sportify.mail.from=${BREVO_MAIL_FROM}